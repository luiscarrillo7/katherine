<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Generador de Mapa de Votos por Región</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        padding: 20px;
        color: #333;
      }
      .panel-control {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        margin-bottom: 20px;
      }
      .grid-checkboxes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        margin-top: 15px;
        margin-bottom: 20px;
      }
      .checkbox-item {
        display: flex;
        align-items: center;
        font-size: 14px;
      }
      .checkbox-item input {
        margin-right: 8px;
      }
      .btn-generar {
        background: #2980b9;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
      }
      .btn-generar:hover {
        background: #3498db;
      }
      #btn-todos, #btn-ninguno {
        cursor: pointer;
        margin-bottom: 10px;
      }

      /* --- ESTILOS DE LA INFOGRAFÍA --- */
      .infografia-canvas {
        display: none; /* Oculto hasta que se genere */
        background: white;
        padding: 40px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: center;
      }
      .titulo-infografia {
        color: #2c3e50;
        margin-bottom: 5px;
      }
      .subtitulo-infografia {
        color: #7f8c8d;
        font-size: 14px;
        margin-bottom: 30px;
      }

      /* Contenedor que aloja el mapa + las líneas + las tarjetas flotantes */
      .mapa-wrapper {
        position: relative;
        width: 900px;
        max-width: 100%;
        margin: 0 auto;
        min-height: 500px;
      }

      /* Aquí va el SVG del mapa, centrado dentro del wrapper */
      .mapa-centro {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 420px;
        z-index: 1;
      }
      .mapa-centro svg {
        width: 100%;
        height: auto;
        display: block;
      }

      /* Capa SVG donde se dibujan las líneas conectoras y los puntos */
      .lineas-conectoras {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }
      .linea-conectora {
        stroke: #95a5a6;
        stroke-width: 1.2;
        stroke-dasharray: 3,3;
      }
      .punto-mapa {
        fill: #2980b9;
        stroke: #ffffff;
        stroke-width: 1.5;
      }

      /* Tarjetitas flotantes con el nombre de la región y sus votos */
      .etiquetas-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 3;
      }
      .etiqueta-region {
        position: absolute;
        width: 180px;
        background: white;
        border: 2px solid #bdc3c7;
        border-radius: 8px;
        padding: 8px 14px;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        text-align: center;
        transform: translateY(-50%);
      }
      .etiqueta-izquierda {
        left: 0;
      }
      .etiqueta-derecha {
        right: 0;
      }
      .etiqueta-region span {
        display: block;
        font-size: 11px;
        color: #2980b9;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .etiqueta-region strong {
        font-size: 16px;
        color: #2c3e50;
      }
    </style>
  </head>
  <body>

    <h2 style="color: #2c3e50; margin-top: 0;">🗳️ Generador de Mapa de Votos por Región</h2>

    <!-- PANEL DE SELECCIÓN -->
    <div class="panel-control">
      <p>Selecciona los departamentos que deseas incluir en el mapa:</p>

      <button type="button" id="btn-todos">Marcar Todos</button>
      <button type="button" id="btn-ninguno">Desmarcar Todos</button>

      <div class="grid-checkboxes" id="contenedor-checkboxes">
        <!-- Los checkboxes se llenan solos con JS a partir de votos_por_region.json -->
      </div>

      <button class="btn-generar" id="btn-generar">Generar Mapa</button>
    </div>

    <!-- ÁREA DE LA INFOGRAFÍA (el resultado visual) -->
    <div class="infografia-canvas" id="resultado-infografia">
      <h2 class="titulo-infografia">Resultados por Región Seleccionada</h2>
      <p class="subtitulo-infografia" id="subtitulo-total"></p>

      <div class="mapa-wrapper" id="mapa-wrapper">

        <div class="mapa-centro" id="mapa-centro">
          <!-- ============================================================ -->
          <!-- PEGA AQUÍ TU ETIQUETA <svg>...</svg> COMPLETA DEL MAPA DE PERÚ -->
          <!-- Debe conservar el grupo <g id="label_points"> con los         -->
          <!-- círculos de cada región (class="NombreRegión", cx, cy)        -->
          <!-- ============================================================ -->
        </div>

        <svg class="lineas-conectoras" id="lineas-conectoras"></svg>

        <div class="etiquetas-container" id="etiquetas-container"></div>

      </div>
    </div>

    <script src="mapa-votos.js"></script>
  </body>
</html>
